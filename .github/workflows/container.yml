name: Build and publish container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version_tag="$image:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tags=(-t "$version_tag")
          if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(-t "$image:latest")
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --no-cache-filter releases \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" --push .
          printf 'Published `%s`\n' "$version_tag" >> "$GITHUB_STEP_SUMMARY"
