name: Build and publish container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch and verify upstream releases
        shell: bash
        run: |
          set -u
          mihomo_repo=MetaCubeX/mihomo
          zashboard_repo=Zephyruso/zashboard
          context="$RUNNER_TEMP/mihomo-upstream"
          mkdir -p "$context/licenses"
          downloads=$(mktemp -d)
          trap 'rm -rf "$downloads"' EXIT
          cd "$downloads"

          fetch() {
            curl --disable --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --retry 3 --retry-max-time 120 \
              --max-time 120 --output "$2" "$1"
          }

          release_tag() {
            jq -er '
              select(.draft == false and .prerelease == false)
              | .tag_name
              | strings
              | select(test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
            ' "$1"
          }

          fetch_license() {
            local repo="$1" tag="$2" destination="$3" expected actual length
            fetch "https://api.github.com/repos/$repo/contents/LICENSE?ref=$tag" license.json
            expected=$(jq -er '
              select(.type == "file" and .encoding == "base64")
              | .sha
              | strings
              | select(test("^[0-9a-f]{40}$"))
            ' license.json)
            jq -er '.content | strings' license.json | base64 -d > "$destination"
            test -s "$destination"
            length=$(wc -c < "$destination" | tr -d '[:space:]')
            actual=$( { printf 'blob %s\0' "$length"; cat "$destination"; } | sha1sum )
            if [[ "${actual%% *}" != "$expected" ]]; then
              printf 'License Git blob checksum mismatch for %s %s\n' "$repo" "$tag" >&2
              return 1
            fi
          }

          fetch_asset() {
            local repo="$1" tag="$2" release="$3" asset="$4" destination="$5" digest
            if ! digest=$(jq -er --arg asset "$asset" '
              .assets[]
              | select(.name == $asset and .state == "uploaded")
              | .digest
              | strings
              | select(test("^sha256:[0-9a-f]{64}$"))
            ' "$release"); then
              printf 'Missing asset or SHA-256 for %s %s (%s)\n' "$repo" "$tag" "$asset" >&2
              return 1
            fi
            fetch "https://github.com/$repo/releases/download/$tag/$asset" "$destination"
            printf '%s  %s\n' "${digest#sha256:}" "$destination" | sha256sum -c -
          }

          fetch "https://api.github.com/repos/$mihomo_repo/releases/latest" mihomo-release.json
          fetch "https://api.github.com/repos/$zashboard_repo/releases/latest" zashboard-release.json
          mihomo_tag=$(release_tag mihomo-release.json)
          zashboard_tag=$(release_tag zashboard-release.json)
          printf 'Mihomo %s\nZashboard %s\n' "$mihomo_tag" "$zashboard_tag" | tee "$context/versions"

          fetch_license "$mihomo_repo" "$mihomo_tag" "$context/licenses/mihomo.LICENSE"
          fetch_license "$zashboard_repo" "$zashboard_tag" "$context/licenses/zashboard.LICENSE"
          fetch_asset "$mihomo_repo" "$mihomo_tag" mihomo-release.json \
            "mihomo-linux-amd64-v1-$mihomo_tag.gz" mihomo-amd64.gz
          fetch_asset "$mihomo_repo" "$mihomo_tag" mihomo-release.json \
            "mihomo-linux-arm64-$mihomo_tag.gz" mihomo-arm64.gz
          fetch_asset "$zashboard_repo" "$zashboard_tag" zashboard-release.json dist-no-fonts.zip zashboard.zip
          gzip -dc mihomo-amd64.gz > "$context/mihomo-amd64"
          gzip -dc mihomo-arm64.gz > "$context/mihomo-arm64"
          unzip -q zashboard.zip 'dist/*' -d "$context"
          test -s "$context/dist/index.html"
          test -s "$context/dist/THIRD_PARTY_NOTICES.md"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version_tag="$image:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tags=(-t "$version_tag")
          if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(-t "$image:latest")
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-context "upstream=$RUNNER_TEMP/mihomo-upstream" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" --push .
          printf 'Published `%s`\n' "$version_tag" >> "$GITHUB_STEP_SUMMARY"
